<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-gray-800 h-full flex flex-col justify-between py-6 px-4 shrink-0 transition-all z-50">
        <div>
            <a href="/feed" class="mb-10 block px-2">
                <i class="fa-solid fa-paper-plane text-3xl hidden md:inline-block md:hidden"></i>
                <h1 class="text-2xl font-bold italic hidden md:block" style="font-family: 'Brush Script MT', cursive;">Daakiyaa</h1>
            </a>
            <div class="space-y-2">
                <a href="/feed" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Home</span>
                </a>
                <a href="/explore" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-compass text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Explore</span>
                </a>
                <a href="/reels" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Reels</span>
                </a>
                <a href="/chat" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition font-bold">
                    <i class="fa-solid fa-message text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Messages</span>
                </a>
                <a href="/matches" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition text-pink-500">
                    <i class="fa-solid fa-fire text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Matches</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Chat Interface -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Chat List -->
        <div class="w-full md:w-96 border-r border-gray-800 flex flex-col h-full bg-[#000]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-xl font-bold">Messages</h2>
                <i class="fa-solid fa-pen-to-square text-xl cursor-pointer hover:text-gray-300"></i>
            </div>
            
            <div class="overflow-y-auto flex-1 p-2 space-y-1">
                
                <!-- Active Chat -->
                <div class="flex items-center p-3 hover:bg-[#262626] rounded-lg cursor-pointer bg-[#262626]">
                    <img src="https://ui-avatars.com/api/?name=Alice&background=random" class="w-14 h-14 rounded-full mr-4">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold truncate text-sm">alice_99</h4>
                        <p class="text-xs text-gray-400 truncate">Sent a reel by daakiyaa_official • 2h</p>
                    </div>
                    <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                </div>

                <!-- Chat Item -->
                <div class="flex items-center p-3 hover:bg-[#262626] rounded-lg cursor-pointer transition">
                    <img src="https://ui-avatars.com/api/?name=Bob&background=random" class="w-14 h-14 rounded-full mr-4">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold truncate text-sm">bob.builder</h4>
                        <p class="text-xs text-gray-400 truncate">Reacted 😂 to your message • 5h</p>
                    </div>
                </div>
                
                <!-- Chat Item -->
                <div class="flex items-center p-3 hover:bg-[#262626] rounded-lg cursor-pointer transition">
                    <img src="https://ui-avatars.com/api/?name=Charlie&background=random" class="w-14 h-14 rounded-full mr-4">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold truncate text-sm">charlie_z</h4>
                        <p class="text-xs text-gray-400 truncate">See you tomorrow! • 1d</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Detail (Hidden on mobile unless active) -->
        <div class="hidden md:flex flex-col flex-1 bg-black">
            <!-- Header -->
            <div class="p-4 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <img src="https://ui-avatars.com/api/?name=Alice&background=random" class="w-10 h-10 rounded-full">
                    <span class="font-bold">alice_99</span>
                </div>
                <div class="space-x-4 text-xl">
                    <i class="fa-solid fa-phone cursor-pointer hover:text-gray-300"></i>
                    <i class="fa-solid fa-video cursor-pointer hover:text-gray-300"></i>
                    <i class="fa-solid fa-circle-info cursor-pointer hover:text-gray-300"></i>
                </div>
            </div>
            
            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-4">
                
                <div class="flex flex-col items-center mb-6">
                    <img src="https://ui-avatars.com/api/?name=Public+Chat&background=random" class="w-24 h-24 rounded-full mb-2">
                    <h3 class="font-bold text-lg">Public Chatroom</h3>
                    <p class="text-gray-400 text-sm">Global Chat</p>
                </div>

                <div class="flex justify-center">
                    <span class="text-xs text-gray-500">Welcome to the global real-time chat!</span>
                </div>

                <!-- Messages will be appended here -->

            </div>

            <!-- Input Area -->
            <div class="p-4">
                <div class="bg-transparent border border-gray-700 rounded-full flex items-center px-4 py-2">
                    <i class="fa-regular fa-face-smile text-xl cursor-pointer hover:text-gray-300"></i>
                    <input type="text" id="chatInput" placeholder="Message..." class="flex-1 bg-transparent border-none focus:outline-none focus:ring-0 mx-4 text-sm">
                    <button id="sendBtn" class="font-bold text-blue-500 hover:text-white transition">Send</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let stompClient = null;
        let currentUser = localStorage.getItem('username') || "user_" + Math.floor(Math.random() * 1000);

        function connect() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // disable debug logs
            stompClient.connect({}, function (frame) {
                console.log('Connected: ' + frame);
                stompClient.subscribe('/topic/public', function (message) {
                    showMessage(JSON.parse(message.body));
                });
            });
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            if (input.value && stompClient) {
                const chatMessage = {
                    sender: currentUser,
                    content: input.value
                };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                input.value = '';
            }
        }

        function showMessage(message) {
            const chatMessages = document.getElementById('chatMessages');
            const isMe = message.sender === currentUser;
            
            let messageHtml = '';
            if (isMe) {
                messageHtml = `
                <div class="flex justify-end items-end">
                    <div class="bg-blue-600 text-sm py-2 px-4 rounded-3xl rounded-br-none max-w-md">
                        ${message.content}
                    </div>
                </div>`;
            } else {
                messageHtml = `
                <div class="flex items-end">
                    <img src="https://ui-avatars.com/api/?name=${message.sender}&background=random" class="w-8 h-8 rounded-full mr-2" title="${message.sender}">
                    <div class="bg-[#262626] text-sm py-2 px-4 rounded-3xl rounded-bl-none max-w-md border border-gray-700">
                        <p class="font-bold text-xs text-gray-400 mb-1">${message.sender}</p>
                        ${message.content}
                    </div>
                </div>`;
            }

            chatMessages.insertAdjacentHTML('beforeend', messageHtml);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Connect on load
        connect();
    </script>
</body>
</html>
