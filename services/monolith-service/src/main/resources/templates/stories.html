<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        .story-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; }
        .story-card { width: 100%; max-width: 400px; height: 100%; max-height: 800px; position: relative; background: #000; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 2px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- Close Button -->
        <a href="/feed" class="absolute top-4 right-4 text-3xl text-white z-50 hover:text-gray-300">
            &times;
        </a>

        <div class="story-card shadow-2xl">
            <!-- Background Image -->
            <img src="https://source.unsplash.com/random/400x800/?night" class="absolute inset-0 w-full h-full object-cover">
            
            <!-- Overlay Gradients -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/60"></div>

            <!-- Top UI -->
            <div class="absolute top-0 left-0 right-0 p-4 z-10">
                <!-- Progress Bars -->
                <div class="flex space-x-1 mb-3">
                    <div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div>
                    <div class="progress-bar"><div class="progress-fill" id="activeProgress"></div></div>
                    <div class="progress-bar"></div>
                </div>

                <!-- User Info -->
                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <img src="https://ui-avatars.com/api/?name=Alice&background=random" class="w-8 h-8 rounded-full border border-white">
                        <span class="font-bold text-sm">alice_99</span>
                        <span class="text-xs text-gray-300">5h</span>
                    </div>
                    <i class="fa-solid fa-ellipsis text-white cursor-pointer"></i>
                </div>
            </div>

            <!-- Click Areas for navigation -->
            <div class="absolute inset-0 flex z-0">
                <div class="w-1/2 cursor-pointer" onclick="window.location.href='/feed'"></div>
                <div class="w-1/2 cursor-pointer" onclick="window.location.href='/feed'"></div>
            </div>

            <!-- Bottom UI -->
            <div class="absolute bottom-0 left-0 right-0 p-4 z-10 flex items-center space-x-4">
                <div class="flex-1 bg-transparent border border-gray-400 rounded-full px-4 py-2">
                    <input type="text" placeholder="Send message" class="bg-transparent text-sm w-full outline-none text-white placeholder-gray-300">
                </div>
                <i class="fa-regular fa-heart text-2xl hover:text-red-500 cursor-pointer"></i>
                <i class="fa-regular fa-paper-plane text-2xl hover:text-gray-300 cursor-pointer"></i>
            </div>
        </div>
    </div>

    <script>
        // Simple progress bar animation
        let width = 0;
        const progress = document.getElementById('activeProgress');
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                window.location.href = '/feed';
            } else {
                width += 1; // 100 * 50ms = 5000ms (5 seconds per story)
                progress.style.width = width + '%';
            }
        }, 50);
    </script>
</body>
</html>
