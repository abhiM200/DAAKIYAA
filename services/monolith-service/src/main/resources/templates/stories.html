<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        .story-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; }
        .story-card { width: 100%; max-width: 400px; height: 100%; max-height: 800px; position: relative; background: #000; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 2px; background: rgba(255,255,255,0.3); flex: 1; border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- Close Button -->
        <a href="/feed" class="absolute top-4 right-4 text-3xl text-white z-50 hover:text-gray-300">
            &times;
        </a>

        <div id="storyCard" class="story-card shadow-2xl flex items-center justify-center text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-4xl"></i>
            <p class="ml-4">Loading stories...</p>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token') || '';
        let stories = [];
        let currentIndex = 0;
        let progressInterval;

        async function loadStories() {
            try {
                const response = await fetch('/api/content/posts/stories', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to load stories');
                const page = await response.json();
                stories = page.content;
                
                if (stories.length === 0) {
                    document.getElementById('storyCard').innerHTML = '<div class="text-center text-gray-400"><i class="fa-solid fa-eye-slash text-4xl mb-4"></i><p>No stories found.</p></div>';
                    setTimeout(() => window.location.href = '/feed', 3000);
                    return;
                }
                
                renderStory(currentIndex);
            } catch (e) {
                console.error(e);
                document.getElementById('storyCard').innerHTML = '<div class="text-red-500">Error loading stories.</div>';
            }
        }

        function renderStory(index) {
            if (index >= stories.length) {
                window.location.href = '/feed'; // End of stories
                return;
            }
            clearInterval(progressInterval);
            
            const story = stories[index];
            const imageUrl = (story.mediaList && story.mediaList.length > 0) ? story.mediaList[0].mediaUrl : null;
            const username = "user_" + story.authorId.substring(0, 5);

            let progressHTML = stories.map((_, i) => {
                if (i < index) return `<div class="progress-bar"><div class="progress-fill" style="width: 100%;"></div></div>`;
                if (i === index) return `<div class="progress-bar"><div class="progress-fill" id="activeProgress"></div></div>`;
                return `<div class="progress-bar"></div>`;
            }).join('');

            const storyHtml = `
            ${imageUrl ? `<img src="${imageUrl}" class="absolute inset-0 w-full h-full object-cover">` : `<div class="absolute inset-0 bg-gradient-to-b from-purple-900 to-black flex items-center justify-center p-8 text-center text-2xl font-bold">${story.textContent || 'No text'}</div>`}
            
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/60"></div>

            <!-- Top UI -->
            <div class="absolute top-0 left-0 right-0 p-4 z-10">
                <div class="flex space-x-1 mb-3">
                    ${progressHTML}
                </div>

                <div class="flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <img src="https://ui-avatars.com/api/?name=${username}&background=random" class="w-8 h-8 rounded-full border border-white">
                        <span class="font-bold text-sm">${username}</span>
                        <span class="text-xs text-gray-300">Just now</span>
                    </div>
                    <i class="fa-solid fa-ellipsis text-white cursor-pointer"></i>
                </div>
            </div>

            <!-- Click Areas -->
            <div class="absolute inset-0 flex z-0">
                <div class="w-1/2 cursor-pointer" onclick="prevStory()"></div>
                <div class="w-1/2 cursor-pointer" onclick="nextStory()"></div>
            </div>

            <!-- Bottom UI -->
            <div class="absolute bottom-0 left-0 right-0 p-4 z-10 flex items-center space-x-4">
                <div class="flex-1 bg-transparent border border-gray-400 rounded-full px-4 py-2">
                    <input type="text" placeholder="Send message" class="bg-transparent text-sm w-full outline-none text-white placeholder-gray-300">
                </div>
                <i class="fa-regular fa-heart text-2xl hover:text-red-500 cursor-pointer"></i>
                <i class="fa-regular fa-paper-plane text-2xl hover:text-gray-300 cursor-pointer"></i>
            </div>
            `;

            document.getElementById('storyCard').innerHTML = storyHtml;

            // Start animation
            let width = 0;
            const progress = document.getElementById('activeProgress');
            progressInterval = setInterval(() => {
                if (width >= 100) {
                    nextStory();
                } else {
                    width += 1;
                    progress.style.width = width + '%';
                }
            }, 50); // 50 * 100 = 5000ms = 5 seconds
        }

        function nextStory() {
            currentIndex++;
            renderStory(currentIndex);
        }

        function prevStory() {
            if (currentIndex > 0) {
                currentIndex--;
                renderStory(currentIndex);
            }
        }

        loadStories();
    </script>
</body>
</html>
