<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Matches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .card-container { perspective: 1000px; position: relative; width: 100%; max-width: 400px; height: 600px; margin: 0 auto; }
        .swipe-card { position: absolute; width: 100%; height: 100%; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); transform-origin: 50% 100%; transition: transform 0.3s ease; }
        .swipe-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 30px 20px 20px 20px; }
        
        .btn-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: transform 0.1s; border: 2px solid; }
        .btn-circle:active { transform: scale(0.9); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-gray-800 h-full flex flex-col justify-between py-6 px-4 shrink-0 transition-all z-50">
        <div>
            <a href="/feed" class="mb-10 block px-2">
                <i class="fa-solid fa-paper-plane text-3xl hidden md:inline-block md:hidden"></i>
                <h1 class="text-2xl font-bold italic hidden md:block" style="font-family: 'Brush Script MT', cursive;">Daakiyaa</h1>
            </a>
            <div class="space-y-2">
                <a href="/feed" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Home</span>
                </a>
                <a href="/explore" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-compass text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Explore</span>
                </a>
                <a href="/reels" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Reels</span>
                </a>
                <a href="/chat" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-regular fa-message text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Messages</span>
                </a>
                <a href="/matches" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition font-bold text-pink-500">
                    <i class="fa-solid fa-fire text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Matches</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar flex flex-col items-center justify-center relative bg-[#111]">
        
        <!-- Profile Creation Modal (Hidden by default) -->
        <div id="profileModal" class="hidden absolute inset-0 bg-black/90 z-[100] flex items-center justify-center">
            <div class="bg-[#262626] p-8 rounded-2xl w-full max-w-md">
                <h2 class="text-2xl font-bold italic text-pink-500 mb-4">Create Dating Profile</h2>
                <p class="text-sm text-gray-300 mb-6">You need a profile before you can start matching!</p>
                <div class="space-y-4">
                    <input type="number" id="ageInput" placeholder="Your Age (e.g. 24)" class="w-full bg-black border border-gray-700 rounded p-3 text-white">
                    <select id="genderInput" class="w-full bg-black border border-gray-700 rounded p-3 text-white">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="lookingForInput" class="w-full bg-black border border-gray-700 rounded p-3 text-white">
                        <option value="">Looking For...</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                    <textarea id="bioInput" placeholder="A short bio about yourself..." class="w-full bg-black border border-gray-700 rounded p-3 text-white"></textarea>
                    <button onclick="createProfile()" class="w-full bg-pink-500 text-white font-bold py-3 rounded hover:bg-pink-600 transition">Save Profile</button>
                </div>
            </div>
        </div>

        <div class="text-center mb-6 z-10">
            <h2 class="text-3xl font-bold italic text-pink-500 mb-2">Find your match</h2>
            <p class="text-gray-400 text-sm">Swipe right to like, left to pass</p>
        </div>

        <div id="cardContainer" class="card-container z-10">
            <!-- Background Card -->
            <div class="swipe-card" style="transform: scale(0.95) translateY(-20px); z-index: 1;">
                <img src="https://source.unsplash.com/random/400x600/?portrait,woman" alt="Profile 2">
                <div class="card-info">
                    <h3 class="text-3xl font-bold mb-1">Sarah, 24</h3>
                    <p class="text-sm text-gray-300"><i class="fa-solid fa-briefcase mr-2"></i> Designer</p>
                    <p class="text-sm text-gray-300"><i class="fa-solid fa-location-dot mr-2"></i> 2 miles away</p>
                </div>
            </div>

            <!-- Active Card -->
            <div class="swipe-card" style="z-index: 2;" id="activeCard">
                <img src="https://source.unsplash.com/random/400x600/?portrait,man" alt="Profile 1">
                <div class="card-info">
                    <h3 class="text-3xl font-bold mb-1">Alex, 27</h3>
                    <p class="text-sm text-gray-300"><i class="fa-solid fa-graduation-cap mr-2"></i> Software Engineer</p>
                    <p class="text-sm text-gray-300"><i class="fa-solid fa-location-dot mr-2"></i> 5 miles away</p>
                    <p class="mt-3 text-sm italic">"Love hiking and building cool apps."</p>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex space-x-8 mt-8">
            <button class="btn-circle border-red-500 text-red-500 hover:bg-red-500/10" onclick="swipe('left')">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button class="btn-circle border-blue-500 text-blue-500 hover:bg-blue-500/10 w-12 h-12 mt-1">
                <i class="fa-solid fa-star text-lg"></i>
            </button>
            <button class="btn-circle border-green-500 text-green-500 hover:bg-green-500/10" onclick="swipe('right')">
                <i class="fa-solid fa-heart"></i>
            </button>
        </div>

    </main>

    <script>
        const token = localStorage.getItem('token') || '';
        let profiles = [];
        let currentIndex = 0;

        async function loadMatches() {
            try {
                const response = await fetch('/api/matches/discover', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 400) {
                    // Profile doesn't exist
                    document.getElementById('profileModal').classList.remove('hidden');
                    return;
                }
                
                if (!response.ok) throw new Error('Failed to load matches');
                const page = await response.json();
                profiles = page.content;
                
                renderCards();
            } catch (e) {
                console.error(e);
            }
        }

        async function createProfile() {
            const age = document.getElementById('ageInput').value;
            const gender = document.getElementById('genderInput').value;
            const lookingFor = document.getElementById('lookingForInput').value;
            const datingBio = document.getElementById('bioInput').value;
            
            if(!age || !lookingFor) { alert('Please fill in age and looking for preferences.'); return; }
            
            try {
                await fetch('/api/matches/profile', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ age: parseInt(age), gender, lookingFor, datingBio })
                });
                document.getElementById('profileModal').classList.add('hidden');
                loadMatches();
            } catch (e) {
                console.error('Error creating profile', e);
            }
        }

        function renderCards() {
            const container = document.getElementById('cardContainer');
            if (currentIndex >= profiles.length) {
                container.innerHTML = '<div class="text-center text-gray-500 mt-20"><i class="fa-solid fa-face-frown text-4xl mb-4"></i><p>No more matches around you.</p></div>';
                return;
            }

            // Render current and next card for stacking effect
            let html = '';
            
            // Next card (background)
            if (currentIndex + 1 < profiles.length) {
                const nextP = profiles[currentIndex + 1];
                const nextName = "user_" + nextP.userId.substring(0, 5);
                html += `
                <div class="swipe-card" style="transform: scale(0.95) translateY(-20px); z-index: 1;">
                    <img src="https://ui-avatars.com/api/?name=${nextName}&size=600&background=random" alt="Profile">
                    <div class="card-info">
                        <h3 class="text-3xl font-bold mb-1">${nextName}, ${nextP.age}</h3>
                        <p class="text-sm text-gray-300"><i class="fa-solid fa-user mr-2"></i> ${nextP.gender}</p>
                        <p class="mt-3 text-sm italic">"${nextP.datingBio || 'No bio.'}"</p>
                    </div>
                </div>`;
            }

            // Current card (foreground)
            const currentP = profiles[currentIndex];
            const currentName = "user_" + currentP.userId.substring(0, 5);
            html += `
            <div class="swipe-card" style="z-index: 2;" id="activeCard">
                <img src="https://ui-avatars.com/api/?name=${currentName}&size=600&background=random" alt="Profile">
                <div class="card-info">
                    <h3 class="text-3xl font-bold mb-1">${currentName}, ${currentP.age}</h3>
                    <p class="text-sm text-gray-300"><i class="fa-solid fa-user mr-2"></i> ${currentP.gender}</p>
                    <p class="mt-3 text-sm italic">"${currentP.datingBio || 'No bio.'}"</p>
                </div>
            </div>`;

            container.innerHTML = html;
        }

        function swipe(direction) {
            if (currentIndex >= profiles.length) return;
            
            const card = document.getElementById('activeCard');
            if(direction === 'left') {
                card.style.transform = 'translate(-200%, 50px) rotate(-30deg)';
            } else {
                card.style.transform = 'translate(200%, 50px) rotate(30deg)';
            }
            card.style.opacity = '0';
            
            setTimeout(() => {
                currentIndex++;
                renderCards();
            }, 300);
        }

        loadMatches();
    </script>

</body>
</html>
