<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .reel-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100vh; }
        .reel { scroll-snap-align: start; height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-gray-800 h-full flex flex-col justify-between py-6 px-4 shrink-0 transition-all z-50 bg-black absolute md:relative">
        <div>
            <a href="/feed" class="mb-10 block px-2">
                <i class="fa-solid fa-paper-plane text-3xl hidden md:inline-block md:hidden"></i>
                <h1 class="text-2xl font-bold italic hidden md:block" style="font-family: 'Brush Script MT', cursive;">Daakiyaa</h1>
            </a>
            <div class="space-y-2">
                <a href="/feed" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Home</span>
                </a>
                <a href="/explore" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-compass text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Explore</span>
                </a>
                <a href="/reels" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition font-bold">
                    <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Reels</span>
                </a>
                <a href="/chat" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-regular fa-message text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Messages</span>
                </a>
                <a href="/matches" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition text-pink-500">
                    <i class="fa-solid fa-fire text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Matches</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Reels Content -->
    <main id="reelsContainer" class="flex-1 reel-container no-scrollbar ml-20 md:ml-0">
        <div class="reel flex flex-col items-center justify-center text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-4xl mb-4"></i>
            <p>Loading reels...</p>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token') || '';
        
        async function loadReels() {
            try {
                const response = await fetch('/api/content/posts/reels', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to load reels');
                const page = await response.json();
                const posts = page.content;
                
                const container = document.getElementById('reelsContainer');
                if (posts.length === 0) {
                    container.innerHTML = '<div class="reel flex flex-col items-center justify-center text-gray-500"><i class="fa-solid fa-video-slash text-6xl mb-4"></i><p>No reels found.</p></div>';
                    return;
                }

                container.innerHTML = posts.map((post, i) => {
                    const videoUrl = (post.mediaList && post.mediaList.length > 0) ? post.mediaList[0].mediaUrl : null;
                    const colors = ['from-blue-900', 'from-purple-900', 'from-pink-900', 'from-gray-900'];
                    const randomColor = colors[i % colors.length];
                    const username = "user_" + post.authorId.substring(0, 5);
                    
                    return `
                    <div class="reel">
                        ${videoUrl ? `
                        <div class="absolute inset-0 bg-black flex items-center justify-center overflow-hidden">
                            <video src="${videoUrl}" class="w-full h-full object-cover" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                        </div>
                        ` : `
                        <div class="absolute inset-0 bg-gradient-to-b ${randomColor} to-black flex flex-col items-center justify-center text-center p-8">
                            <i class="fa-solid fa-play text-6xl text-white/50 mb-6"></i>
                            <h2 class="text-3xl font-bold italic mb-4">Reel Preview</h2>
                        </div>
                        `}
                        <!-- Overlay UI -->
                        <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent flex justify-between items-end">
                            <div class="mb-4">
                                <div class="flex items-center space-x-2 mb-2">
                                    <img src="https://ui-avatars.com/api/?name=${username}&background=random" class="w-10 h-10 rounded-full border border-white">
                                    <span class="font-bold">${username}</span>
                                    <button class="border border-white text-xs px-2 py-1 rounded ml-2 font-semibold hover:bg-white hover:text-black transition">Follow</button>
                                </div>
                                <p class="text-sm w-3/4 mb-2 shadow-sm">${post.textContent || 'No caption provided'}</p>
                                <div class="flex items-center space-x-2 text-xs bg-black/40 w-fit px-3 py-1.5 rounded-full backdrop-blur-md border border-white/10">
                                    <i class="fa-solid fa-music"></i>
                                    <marquee class="w-32" scrollamount="3">${username} • Original Audio • Global Sounds</marquee>
                                </div>
                            </div>
                            
                            <div class="flex flex-col items-center space-y-4 mb-4 mr-2">
                                <div class="flex flex-col items-center">
                                    <i class="fa-solid fa-heart text-white text-3xl hover:text-red-500 cursor-pointer transition"></i>
                                    <span class="text-xs mt-1 drop-shadow-md font-bold">Like</span>
                                </div>
                                <div class="flex flex-col items-center">
                                    <i class="fa-solid fa-comment text-white text-3xl hover:text-gray-300 cursor-pointer transition"></i>
                                    <span class="text-xs mt-1 drop-shadow-md font-bold">Comment</span>
                                </div>
                                <div class="flex flex-col items-center">
                                    <i class="fa-solid fa-paper-plane text-white text-3xl hover:text-gray-300 cursor-pointer transition"></i>
                                    <span class="text-xs mt-1 drop-shadow-md font-bold">Share</span>
                                </div>
                                <div class="flex flex-col items-center mt-2">
                                    <img src="https://ui-avatars.com/api/?name=Audio&background=000&color=fff" class="w-10 h-10 rounded-full border-2 border-white animate-spin shadow-lg" style="animation-duration: 4s;">
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('reelsContainer').innerHTML = '<div class="reel flex flex-col items-center justify-center text-red-500"><p>Error loading reels.</p></div>';
            }
        }

        // Initial Load
        loadReels();
    </script>
</body>
