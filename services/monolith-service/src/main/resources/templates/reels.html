<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Reels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .reel-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100vh; }
        .reel { scroll-snap-align: start; height: 100vh; position: relative; display: flex; justify-content: center; align-items: center; background: #111; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-gray-800 h-full flex flex-col justify-between py-6 px-4 shrink-0 transition-all z-50 bg-black absolute md:relative">
        <div>
            <a href="/feed" class="mb-10 block px-2">
                <i class="fa-solid fa-paper-plane text-3xl hidden md:inline-block md:hidden"></i>
                <h1 class="text-2xl font-bold italic hidden md:block" style="font-family: 'Brush Script MT', cursive;">Daakiyaa</h1>
            </a>
            <div class="space-y-2">
                <a href="/feed" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Home</span>
                </a>
                <a href="/explore" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-compass text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Explore</span>
                </a>
                <a href="/reels" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition font-bold">
                    <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Reels</span>
                </a>
                <a href="/chat" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-regular fa-message text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Messages</span>
                </a>
                <a href="/matches" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition text-pink-500">
                    <i class="fa-solid fa-fire text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Matches</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Reels Content -->
    <main class="flex-1 reel-container no-scrollbar ml-20 md:ml-0">
        
        <!-- Reel 1 -->
        <div class="reel">
            <!-- Video Placeholder -->
            <div class="absolute inset-0 bg-gradient-to-b from-gray-900 to-black flex items-center justify-center">
                <i class="fa-solid fa-play text-6xl text-white/50"></i>
            </div>
            <!-- Overlay UI -->
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent flex justify-between items-end">
                <div class="mb-4">
                    <div class="flex items-center space-x-2 mb-2">
                        <img src="https://ui-avatars.com/api/?name=DJ+Snake&background=random" class="w-10 h-10 rounded-full border border-white">
                        <span class="font-bold">dj_snake</span>
                        <button class="border border-white text-xs px-2 py-1 rounded ml-2 font-semibold">Follow</button>
                    </div>
                    <p class="text-sm w-3/4 mb-2">New sound dropping! Share this if you vibe with it 🎶🔥 #music #beats</p>
                    <div class="flex items-center space-x-2 text-xs bg-white/20 w-fit px-2 py-1 rounded-full backdrop-blur-md">
                        <i class="fa-solid fa-music"></i>
                        <marquee class="w-32" scrollamount="3">dj_snake • Original Audio • Global Sounds</marquee>
                    </div>
                </div>
                
                <div class="flex flex-col items-center space-y-4 mb-4 mr-2">
                    <div class="flex flex-col items-center">
                        <i class="fa-regular fa-heart text-3xl hover:text-red-500 cursor-pointer transition"></i>
                        <span class="text-xs mt-1">45.2K</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="fa-regular fa-comment text-3xl cursor-pointer"></i>
                        <span class="text-xs mt-1">1,203</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="fa-regular fa-paper-plane text-3xl cursor-pointer"></i>
                        <span class="text-xs mt-1">Share</span>
                    </div>
                    <div class="flex flex-col items-center mt-2">
                        <img src="https://ui-avatars.com/api/?name=Audio&background=000&color=fff" class="w-8 h-8 rounded-md border-2 border-white animate-spin" style="animation-duration: 3s;">
                    </div>
                </div>
            </div>
        </div>

        <!-- Reel 2 -->
        <div class="reel">
            <div class="absolute inset-0 bg-gradient-to-b from-blue-900 to-black flex items-center justify-center">
                <i class="fa-solid fa-play text-6xl text-white/50"></i>
            </div>
            <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/80 to-transparent flex justify-between items-end">
                <div class="mb-4">
                    <div class="flex items-center space-x-2 mb-2">
                        <img src="https://ui-avatars.com/api/?name=Travel&background=random" class="w-10 h-10 rounded-full border border-white">
                        <span class="font-bold">travel_daily</span>
                        <button class="border border-white text-xs px-2 py-1 rounded ml-2 font-semibold">Follow</button>
                    </div>
                    <p class="text-sm w-3/4 mb-2">Wait for the sunset... 🌅</p>
                    <div class="flex items-center space-x-2 text-xs bg-white/20 w-fit px-2 py-1 rounded-full backdrop-blur-md">
                        <i class="fa-solid fa-music"></i>
                        <span>Trending • Chill Vibes</span>
                    </div>
                </div>
                <div class="flex flex-col items-center space-y-4 mb-4 mr-2">
                    <div class="flex flex-col items-center">
                        <i class="fa-solid fa-heart text-red-500 text-3xl cursor-pointer"></i>
                        <span class="text-xs mt-1">899K</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="fa-regular fa-comment text-3xl cursor-pointer"></i>
                        <span class="text-xs mt-1">4,302</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <i class="fa-regular fa-paper-plane text-3xl cursor-pointer"></i>
                    </div>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
