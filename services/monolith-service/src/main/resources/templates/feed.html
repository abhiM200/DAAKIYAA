<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">DAAKIYAA</h1>
            <div class="space-x-4">
                <a href="/explore" class="text-gray-600 hover:text-blue-600">Explore</a>
                <a href="/matches" class="text-gray-600 hover:text-blue-600">Matches</a>
                <a href="/chat" class="text-gray-600 hover:text-blue-600">Chat</a>
                <a href="/" class="text-gray-600 hover:text-red-600">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-6 p-4">
        <!-- Sidebar -->
        <div class="hidden md:block col-span-1 bg-white p-4 rounded-lg shadow-sm h-fit">
            <h3 class="font-bold text-lg mb-4">Your Profile</h3>
            <p class="text-gray-600 mb-2">Welcome back!</p>
            <hr class="my-4">
            <ul class="space-y-2">
                <li><a href="/feed" class="text-blue-600 font-medium">Home Feed</a></li>
                <li><a href="/stories" class="text-gray-600 hover:text-blue-600">Stories</a></li>
                <li><a href="/reels" class="text-gray-600 hover:text-blue-600">Reels</a></li>
            </ul>
        </div>

        <!-- Feed Posts -->
        <div class="col-span-1 md:col-span-2 space-y-6">
            <!-- Create Post -->
            <div class="bg-white p-4 rounded-lg shadow-sm">
                <textarea class="w-full border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 border" placeholder="What's on your mind?"></textarea>
                <div class="mt-2 flex justify-end">
                    <button class="bg-blue-600 text-white px-4 py-2 rounded font-medium hover:bg-blue-700">Post</button>
                </div>
            </div>

            <!-- Sample Post -->
            <div class="bg-white p-4 rounded-lg shadow-sm">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 bg-gray-300 rounded-full mr-3"></div>
                    <div>
                        <h4 class="font-bold">John Doe</h4>
                        <p class="text-xs text-gray-500">2 hours ago</p>
                    </div>
                </div>
                <p class="text-gray-800 mb-4">Just migrated the architecture to a pure Spring Boot and Thymeleaf monolith! So fast and lightweight. 🚀</p>
                <div class="flex space-x-4 border-t pt-3 text-sm text-gray-600">
                    <button class="hover:text-blue-600">Like</button>
                    <button class="hover:text-blue-600">Comment</button>
                    <button class="hover:text-blue-600">Share</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
