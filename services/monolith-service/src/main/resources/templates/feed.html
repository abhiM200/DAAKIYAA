<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">DAAKIYAA - Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; border-radius: 50%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <nav class="w-20 md:w-64 border-r border-gray-800 h-full flex flex-col justify-between py-6 px-4 shrink-0 transition-all">
        <div>
            <a href="/feed" class="mb-10 block px-2">
                <i class="fa-solid fa-paper-plane text-3xl hidden md:inline-block md:hidden"></i>
                <h1 class="text-2xl font-bold italic hidden md:block" style="font-family: 'Brush Script MT', cursive;">Daakiyaa</h1>
            </a>
            <div class="space-y-2">
                <a href="/feed" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition font-bold">
                    <i class="fa-solid fa-house text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Home</span>
                </a>
                <a href="/explore" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-compass text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Explore</span>
                </a>
                <a href="/reels" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Reels</span>
                </a>
                <a href="/chat" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-regular fa-message text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Messages</span>
                </a>
                <a href="/matches" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition text-pink-500">
                    <i class="fa-solid fa-fire text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Matches</span>
                </a>
                <a href="#" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-white/10 transition" onclick="document.getElementById('createModal').classList.remove('hidden')">
                    <i class="fa-regular fa-square-plus text-xl w-6 text-center"></i>
                    <span class="hidden md:block">Create</span>
                </a>
            </div>
        </div>
        <div>
            <a href="/" class="flex items-center space-x-4 p-3 rounded-lg hover:bg-red-500/20 text-red-500 transition mt-auto">
                <i class="fa-solid fa-arrow-right-from-bracket text-xl w-6 text-center"></i>
                <span class="hidden md:block">Logout</span>
            </a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar flex justify-center pb-20 md:pb-0">
        <div class="w-full max-w-lg mt-8 px-4">
            
            <!-- Stories Section -->
            <div class="flex space-x-4 overflow-x-auto no-scrollbar mb-8 pb-2">
                <!-- User Story (Add) -->
                <div class="flex flex-col items-center space-y-1 cursor-pointer min-w-[70px]">
                    <div class="relative">
                        <img src="https://ui-avatars.com/api/?name=You&background=random" class="w-16 h-16 rounded-full border-2 border-black" alt="Your Story">
                        <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full border-2 border-black w-5 h-5 flex items-center justify-center text-xs font-bold">+</div>
                    </div>
                    <span class="text-xs text-gray-400">Your story</span>
                </div>
                <!-- Other Stories -->
                <div class="flex flex-col items-center space-y-1 cursor-pointer min-w-[70px]" onclick="window.location.href='/stories'">
                    <div class="story-ring">
                        <img src="https://ui-avatars.com/api/?name=Alice&background=random" class="w-15 h-15 rounded-full border-2 border-black" alt="Alice">
                    </div>
                    <span class="text-xs text-gray-300">alice_99</span>
                </div>
                <div class="flex flex-col items-center space-y-1 cursor-pointer min-w-[70px]">
                    <div class="story-ring">
                        <img src="https://ui-avatars.com/api/?name=Bob&background=random" class="w-15 h-15 rounded-full border-2 border-black" alt="Bob">
                    </div>
                    <span class="text-xs text-gray-300">bob.builder</span>
                </div>
                <div class="flex flex-col items-center space-y-1 cursor-pointer min-w-[70px]">
                    <div class="story-ring">
                        <img src="https://ui-avatars.com/api/?name=Charlie&background=random" class="w-15 h-15 rounded-full border-2 border-black" alt="Charlie">
                    </div>
                    <span class="text-xs text-gray-300">charlie_z</span>
                </div>
            </div>

            <!-- Feed Posts -->
            <div id="feedContainer" class="space-y-8">
                <!-- Posts will be loaded here dynamically by JavaScript -->
                <div class="text-center text-gray-500 py-10">
                    <i class="fa-solid fa-spinner fa-spin text-3xl mb-4"></i>
                    <p>Loading posts...</p>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Create Modal (Hidden by default) -->
    <div id="createModal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
        <div class="bg-[#262626] w-full max-w-lg rounded-xl border border-gray-700 flex flex-col">
            <div class="border-b border-gray-700 p-3 text-center flex justify-between items-center">
                <span class="w-6"></span>
                <h3 class="font-bold">Create new post</h3>
                <button onclick="document.getElementById('createModal').classList.add('hidden')" class="w-6 text-xl hover:text-gray-400">&times;</button>
            </div>
            <form id="createPostForm" class="p-6 flex flex-col space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Image URL (leave blank for random)</label>
                    <input type="text" id="postImageUrl" placeholder="https://..." class="w-full bg-black border border-gray-600 rounded p-2 focus:outline-none focus:border-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Caption</label>
                    <textarea id="postCaption" rows="4" placeholder="Write a caption..." class="w-full bg-black border border-gray-600 rounded p-2 focus:outline-none focus:border-blue-500 text-sm" required></textarea>
                </div>
                <button type="submit" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600 transition mt-4">Share Post</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token') || '';
        
        async function loadFeed() {
            try {
                const response = await fetch('/api/content/posts/feed', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Failed to load feed');
                const page = await response.json();
                const posts = page.content;
                
                const container = document.getElementById('feedContainer');
                if (posts.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-10"><p>No posts yet. Be the first to post!</p></div>';
                    return;
                }

                container.innerHTML = posts.map(post => {
                    const imageUrl = (post.mediaList && post.mediaList.length > 0) ? post.mediaList[0].mediaUrl : null;
                    const date = new Date(post.createdAt).toLocaleDateString();
                    
                    return `
                    <div class="border-b border-gray-800 pb-6">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-3 cursor-pointer">
                                <div class="story-ring">
                                    <img src="https://ui-avatars.com/api/?name=User&background=random" class="w-8 h-8 rounded-full border border-black">
                                </div>
                                <div>
                                    <h4 class="text-sm font-semibold">user_${post.authorId.substring(0, 5)} <span class="text-gray-500 font-normal ml-1">• ${date}</span></h4>
                                </div>
                            </div>
                            <i class="fa-solid fa-ellipsis hover:text-gray-400 cursor-pointer"></i>
                        </div>
                        ${imageUrl ? `
                        <div class="w-full h-96 bg-gray-900 rounded-md border border-gray-800 flex items-center justify-center mb-3 overflow-hidden">
                            <img src="${imageUrl}" class="w-full h-full object-cover">
                        </div>` : `
                        <div class="w-full bg-gray-900 rounded-md border border-gray-800 p-8 flex items-center justify-center mb-3 text-center italic font-serif text-xl">
                            ${post.textContent}
                        </div>
                        `}
                        <div class="flex justify-between items-center mb-2 mt-2">
                            <div class="flex space-x-4 text-2xl">
                                <i class="fa-regular fa-heart hover:text-gray-400 cursor-pointer transition"></i>
                                <i class="fa-regular fa-comment hover:text-gray-400 cursor-pointer transition"></i>
                                <i class="fa-regular fa-paper-plane hover:text-gray-400 cursor-pointer transition"></i>
                            </div>
                            <i class="fa-regular fa-bookmark text-2xl hover:text-gray-400 cursor-pointer transition"></i>
                        </div>
                        ${imageUrl ? `<p class="text-sm"><span class="font-semibold mr-2">user_${post.authorId.substring(0, 5)}</span>${post.textContent}</p>` : ''}
                    </div>
                    `;
                }).join('');

            } catch (e) {
                console.error(e);
                document.getElementById('feedContainer').innerHTML = '<div class="text-center text-red-500 py-10"><p>Error loading posts.</p></div>';
            }
        }

        document.getElementById('createPostForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let imageUrl = document.getElementById('postImageUrl').value;
            const textContent = document.getElementById('postCaption').value;

            if (!imageUrl) {
                // generate a random unsplash image if none provided
                const randomId = Math.floor(Math.random() * 1000);
                imageUrl = `https://source.unsplash.com/random/800x800?sig=${randomId}`;
            }

            try {
                const response = await fetch('/api/content/posts', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ textContent, imageUrl })
                });

                if (response.ok) {
                    document.getElementById('createModal').classList.add('hidden');
                    document.getElementById('createPostForm').reset();
                    loadFeed(); // refresh feed
                } else {
                    alert('Failed to create post');
                }
            } catch (err) {
                console.error(err);
                alert('Error creating post');
            }
        });

        // Initial Load
        loadFeed();
    </script>
</body>
</html>
