databases:
  - name: daakiyaa-db
    databaseName: daakiyaa
    user: daakiyaa_user

services:
  - type: web
    name: daakiyaa
    env: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: daakiyaa-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: daakiyaa-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: daakiyaa-db
          property: password
      - key: DATABASE_HOST
        fromDatabase:
          name: daakiyaa-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: daakiyaa-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: daakiyaa-db
          property: database
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: RENDER_EXTERNAL_URL
        value: https://daakiyaa.onrender.com
